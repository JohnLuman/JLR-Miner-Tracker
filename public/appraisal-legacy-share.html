<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JLR Archived Build</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;font-family:Oxanium,system-ui,sans-serif;background:#080b12;color:#e8eefb}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#171d31 0,#080b12 55%);padding:32px}
    main{max-width:1100px;margin:auto}.eyebrow{font:12px "Share Tech Mono",monospace;letter-spacing:.16em;color:#8fa4d8}
    h1{margin:.4rem 0 0;font-size:clamp(28px,5vw,52px)} .sub{color:#9ba8bf;margin:.5rem 0 1.5rem}
    .panel{background:rgba(13,18,31,.88);border:1px solid #29324b;border-radius:18px;padding:22px;box-shadow:0 22px 70px rgba(0,0,0,.28)}
    .head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.chip{font:12px "Share Tech Mono";padding:7px 10px;border:1px solid #47577e;border-radius:999px}
    .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px 0}.kpi{padding:13px;background:#0a0e18;border:1px solid #242d43;border-radius:12px}
    .kpi span{display:block;font:11px "Share Tech Mono";color:#7f8da9}.kpi strong{display:block;margin-top:5px;font-size:18px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.list{display:grid;gap:8px}.row{padding:11px 12px;background:#0b101c;border:1px solid #252d42;border-radius:10px;display:flex;justify-content:space-between;gap:14px}.row small{display:block;color:#7f8da9;margin-top:3px}
    h2{font-size:17px;margin:0 0 10px}.notes{padding:12px;background:#0b101c;border-radius:10px;color:#aebbd2;margin-top:14px;white-space:pre-wrap}
    .error{color:#ff9e9e}.footer{margin-top:18px;color:#6f7c96;font:12px "Share Tech Mono"}
    @media(max-width:760px){body{padding:16px}.grid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.head{display:block}.chip{display:inline-block;margin-top:10px}}
  </style>
  <link rel="stylesheet" href="/connected-rail.css?v=2">
</head>
<body class="jlr-rail-controls">
<main>
  <span class="eyebrow">JLR HUB // ARCHIVED APPRAISAL</span>
  <div id="root" class="panel" style="margin-top:12px">Loading archived build…</div>
</main>
<script src="/appraisal-legacy-share.js?v=1" defer></script>
</body>
</html>

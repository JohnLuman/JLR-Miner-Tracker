<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#070b12">
  <meta property="og:title" content="JLR Shared Scan">
  <meta property="og:description" content="Shared EVE Online Local or directional scan hosted by JLR Miner Tracker.">
  <meta name="description" content="Shared EVE Online Local or directional scan hosted by JLR Miner Tracker.">
  <title>JLR Shared Scan</title>
  <link rel="stylesheet" href="/dscan-share.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <div>
        <span class="eyebrow">JLR MINER TRACKER • SHARED INTEL</span>
        <h1 id="shareTitle">SCAN SHARE</h1>
        <p id="scanMeta">Loading shared scan…</p>
      </div>
      <div class="hero-actions">
        <button id="copyScan" type="button" disabled>COPY SCAN</button>
        <a href="/" class="secondary">OPEN JLR</a>
      </div>
    </header>

    <section id="errorPanel" class="panel error hidden"></section>

    <section id="content" class="hidden">
      <div class="stats">
        <article><span id="stat1Label">ROWS</span><strong id="stat1Value">0</strong></article>
        <article><span id="stat2Label">GROUPS</span><strong id="stat2Value">0</strong></article>
        <article><span id="stat3Label">RAW LINES</span><strong id="stat3Value">0</strong></article>
      </div>

      <section class="panel">
        <div class="panel-head">
          <div><span class="kicker">COMPOSITION</span><h2 id="summaryTitle">SCAN BREAKDOWN</h2></div>
          <input id="filter" type="search" autocomplete="off" placeholder="Filter scan…">
        </div>
        <div id="summaryHost"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div><span class="kicker">DETAIL</span><h2 id="detailTitle">SCAN DETAILS</h2></div>
          <span id="shownCount" class="muted"></span>
        </div>
        <div class="table-wrap">
          <table>
            <thead id="detailHead"></thead>
            <tbody id="detailRows"></tbody>
          </table>
        </div>
      </section>

      <details class="panel raw">
        <summary id="rawSummary">RAW SCAN TEXT</summary>
        <pre id="rawText"></pre>
      </details>
    </section>
  </main>
  <script src="/dscan-share.js"></script>
</body>
</html>
